[package]
name = "rpkg-diff"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
fn-error-context = "0.2.1"
itertools = "0.14.0"
tryvial = "0.2.0"
hitman-commons = { git = "https://github.com/atampy25/hitman-commons" }
hitman-formats = { git = "https://github.com/atampy25/hitman-formats", features = ["ores", "material", "wwev", "sdef", "serde"] }
hitman-bin1 = { git = "https://github.com/atampy25/hitman-bin1" }
serde_json = "1.0.145"
glacier-texture = "1.1.0"
ecow = "0.2.6"
inventory = "0.3.21"

papaya = { version = "0.2.3", optional = true }
clap = { version = "4.5.48", features = ["derive"], optional = true }
clap_complete = { version = "4.5.58", optional = true }
compress-tools = { version = "0.15.1", optional = true }
exitcode = { version = "1.1.2", optional = true }
rayon = { version = "1.11.0", optional = true }
rpkg-rs = { version = "1.3.1", optional = true }
iocraft = { version = "0.7.12", optional = true }
indexmap = { version = "2.11.4", features = ["rayon"], optional = true }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"], optional = true }

[features]
cli = [
    "papaya",
    "clap",
    "clap_complete",
    "compress-tools",
    "exitcode",
    "rayon",
    "rpkg-rs",
    "hitman-commons/rpkg-rs",
    "hitman-commons/hash_list",
    "iocraft",
    "indexmap",
    "tokio"
]

[[bin]]
name = "rpkg-diff"
required-features = ["cli"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.hitman-bin1]
debug = false
opt-level = 0
