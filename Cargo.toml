[package]
name = "rpkg-diff"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
fn-error-context = "0.2.1"
itertools = "0.15.0"
tryvial = "0.2.0"
glacier-commons = { git = "https://github.com/atampy25/glacier-commons" }
glacier-formats = { git = "https://github.com/atampy25/glacier-formats", features = [
    "ores",
    "material",
    "wwev",
    "sdef",
    "serde",
] }
glacier-bin1 = { git = "https://github.com/atampy25/glacier-bin1", features = [
    "h3",
    "TEMP",
    "TBLU",
    "ORES",
] }
serde_json = "1.0.145"
glacier-texture = "2.1.1"
ecow = "0.3.0"
inventory = "0.3.21"

papaya = { version = "0.2.3", optional = true }
clap = { version = "4.5.48", features = ["derive"], optional = true }
clap_complete = { version = "4.5.58", optional = true }
compress-tools = { version = "0.16.1", optional = true }
exitcode = { version = "1.1.2", optional = true }
rayon = { version = "1.11.0", optional = true }
rpkg-rs = { git = "https://github.com/dafitius/rpkg-rs", branch = "v2", optional = true }
iocraft = { version = "0.8.3", optional = true }
indexmap = { version = "2.14.0", features = ["rayon"], optional = true }
tokio = { version = "1.47.1", features = [
    "macros",
    "rt-multi-thread",
], optional = true }

[features]
cli = [
    "papaya",
    "clap",
    "clap_complete",
    "compress-tools",
    "exitcode",
    "rayon",
    "rpkg-rs",
    "glacier-commons/rpkg-rs-2",
    "glacier-commons/hash-list",
    "glacier-commons/hash-list-download",
    "iocraft",
    "indexmap",
    "tokio",
]

[[bin]]
name = "rpkg-diff"
required-features = ["cli"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.glacier-bin1]
debug = false
opt-level = 0
